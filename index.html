<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>魔方教室 — 學扭魔方</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="mode-teach ui-minimal no-header">
  <div id="app">
    <div id="stage">
      <div id="viewport" aria-label="立體魔方視圖"></div>

      <div id="caption-bar" class="caption-bar tv-subs" hidden aria-live="polite">
        <p id="caption-current" class="caption-current"></p>
      </div>

      <div id="controls" class="controls-bar listen-only" aria-label="操作區">
        <div class="listen-primary-row">
          <button type="button" id="btn-play-all" class="primary play-all-btn">由頭播教學</button>
          <button type="button" id="btn-stop-all" class="stop-all-btn" hidden>停止</button>
        </div>
        <div class="move-pad" id="move-pad" aria-label="轉面掣" hidden></div>
      </div>
    </div>

    <aside id="sidebar">
      <div class="side-tabs" role="tablist">
        <button type="button" class="side-tab active" data-tab="teach" role="tab" aria-selected="true">教學</button>
        <button type="button" class="side-tab" data-tab="formulas" role="tab" aria-selected="false">公式</button>
        <button type="button" class="side-tab secondary-tab" data-tab="keys" role="tab" aria-selected="false">快捷鍵</button>
      </div>

      <div class="sidebar-scroll">
        <div class="tab-pane active" id="tab-teach" role="tabpanel">
          <section class="panel teach-only" id="step-panel">
            <h2>層先法教學 <span class="badge" id="step-badge">1 / 7</span></h2>
            <div class="step-title" id="step-title"></div>
            <div class="step-desc" id="step-desc"></div>
            <div id="algo-list" class="algo-list-compact"></div>
            <div class="nav-row">
              <button type="button" id="btn-prev" title="快捷鍵 [">上一步</button>
              <button type="button" id="btn-demo" class="demo">再播呢步</button>
              <button type="button" id="btn-next" title="快捷鍵 ]">下一步</button>
            </div>
          </section>
        </div>

        <div class="tab-pane" id="tab-formulas" role="tabpanel">
          <section class="panel">
            <h2>常用公式一覽</h2>
            <p class="hint" style="margin-top:0;margin-bottom:12px">初學者層先法最常用嘅公式。撳「示範」可以睇動畫。</p>
            <div id="formula-catalog"></div>
          </section>
        </div>

        <div class="tab-pane" id="tab-keys" role="tabpanel">
          <section class="panel">
            <h2>鍵盤快捷鍵</h2>
            <p class="hint" style="margin-top:0;margin-bottom:12px">熟咗符號之後嘅速查表（可選）。</p>
            <div class="shortcut-section">
              <h3>轉面</h3>
              <div class="shortcut-grid" id="shortcut-moves"></div>
            </div>
            <div class="shortcut-section">
              <h3>操作</h3>
              <div class="shortcut-grid" id="shortcut-ops"></div>
            </div>
            <div class="shortcut-section">
              <h3>教學導航</h3>
              <div class="shortcut-grid" id="shortcut-nav"></div>
            </div>
          </section>
        </div>
      </div>
      <div class="status-bar" id="status">準備就緒 — 撳「由頭播教學」開始</div>
    </aside>
  </div>

  <!-- Hidden stubs so older binders stay safe if referenced -->
  <div id="ui-stubs" hidden aria-hidden="true">
    <input type="checkbox" id="autoplay-voice" />
    <button type="button" id="btn-mode-teach" data-mode="teach"></button>
    <button type="button" id="btn-mode-free" data-mode="free"></button>
    <button type="button" id="btn-scramble"></button>
    <button type="button" id="btn-reset"></button>
    <button type="button" id="btn-undo"></button>
    <button type="button" id="btn-more"></button>
    <div id="more-panel"></div>
    <input type="range" id="speed" min="0.4" max="2.5" step="0.1" value="1" />
    <span id="speed-label"></span>
    <input type="checkbox" id="show-move-pad" />
    <button type="button" id="btn-listen"></button>
    <button type="button" id="btn-stop-voice"></button>
    <span id="voice-status"></span>
    <ul id="checklist"></ul>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
